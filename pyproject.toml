[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rpcms-progres-auth"
version = "0.1.0"
description = "RPCMS adapter for authentication-only checks against UNHCR ProGres v4 (Yes/No, no data returned)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "pydantic>=2.5", "pydantic-settings>=2.2", "pyjwt>=2.8", "uvicorn>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/rpcms_progres_auth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
